<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>绘境 · 图像创作台</title>
    <script>
      (function () {
        try {
          if ((localStorage.getItem("gpt-image-theme") || "light") === "light") {
            document.documentElement.dataset.theme = "light";
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
