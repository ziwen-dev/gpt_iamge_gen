# 宿主机 /docker/nginx/conf.d/game.conf → 容器 /etc/nginx/conf.d/game.conf
#
# 挂载（你当前环境）：
#   宿主机 /docker/nginx/html  →  容器 /usr/share/nginx/html
# 故 root 必须写 /usr/share/nginx/html（不要写 /docker/nginx/html）
#
# 宿主机放文件：
#   /docker/nginx/html/index.html
#   /docker/nginx/html/image_gpt/index.html
#
# 容器内检查：docker exec nginx ls -la /usr/share/nginx/html/

# 502 时：宿主机先 curl 127.0.0.1:5050/api/health；容器内再测网关（见下方注释）
# 后端须监听 0.0.0.0:5050，不能只绑 127.0.0.1
# 网关 IP：docker inspect nginx --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}'
upstream gpt_image_tool_backend {
    server 172.17.0.1:5050;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name 39.105.53.245 _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 55m;

    # ---------- 绘境 ----------

    location = /image_gpt {
        return 301 /image_gpt/;
    }

    location ^~ /image_gpt/api/edit {
        rewrite ^/image_gpt(/api/.*)$ $1 break;
        proxy_pass http://gpt_image_tool_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        client_max_body_size 55m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    1200s;
        proxy_read_timeout    1200s;
        proxy_redirect off;
    }

    location ^~ /image_gpt/api/ {
        rewrite ^/image_gpt(/api/.*)$ $1 break;
        proxy_pass http://gpt_image_tool_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_redirect off;
    }

    location ^~ /image_gpt/assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ^~ /image_gpt/ {
        try_files $uri $uri/ @image_gpt_fallback;
    }

    location @image_gpt_fallback {
        try_files /image_gpt/index.html =404;
    }

    # ---------- 主站静态（无 3000 反代）----------

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /bundle.js {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ @main_fallback;
    }

    location @main_fallback {
        try_files /index.html =404;
    }
}
