# gpt-image-tool — Nginx：Vue 静态前端 + /api 反代 Python
#
# 部署：
#   cd frontend && npm ci && npm run build
#   rsync -a --delete frontend/dist/ /opt/gpt-image-tool/www/
#   .venv/bin/gunicorn -w 2 -b 127.0.0.1:5050 --timeout 1200 'app:app'
#
#   sudo cp deploy/nginx/gpt-image-tool.conf \
#            deploy/nginx/gpt-image-tool-locations.inc \
#            /etc/nginx/sites-available/
#   # 按需修改 www 路径、listen、server_name
#   sudo ln -sf /etc/nginx/sites-available/gpt-image-tool.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream gpt_image_tool_backend {
    server 127.0.0.1:5050;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 方案 A（推荐）：8080 端口，与 80 上其它站点并存
# 访问：http://39.105.53.245:8080/
# ---------------------------------------------------------------------------
server {
    listen 8080;
    listen [::]:8080;
    server_name 39.105.53.245 _;

    root /opt/gpt-image-tool/www;
    index index.html;

    access_log /var/log/nginx/gpt-image-tool.access.log;
    error_log  /var/log/nginx/gpt-image-tool.error.log;

    client_max_body_size 55m;
    client_body_timeout 300s;
    send_timeout 300s;

    include /etc/nginx/sites-available/gpt-image-tool-locations.inc;
}

